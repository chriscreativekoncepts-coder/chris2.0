<style>
:root{
  --bg:#e8efe0;
  --bg-alt:#dce8c9;
  --surface:#f7faf3;
  --surface-2:#eaf1e1;
  --border:#c3d6b1;
  --border-soft:#d7e6c5;
  --text:#1c2714;
  --text-dim:#56664a;
  --text-faint:#7c8a6e;
  --accent:#6fa23c;
  --accent-dark:#538028;
  --amber:#e0983f;
  --blue:#5f9bd6;
  --rust:#d3684a;
  --violet:#b481d9;
  --danger:#d3684a;
  --radius:14px;
  --radius-sm:10px;
  --tap:48px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}
.app{max-width:900px;margin:0 auto;padding:0 0 100px;position:relative;z-index:1;}
button{touch-action:manipulation;}

/* ---------- Header ---------- */
.hero{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(160deg, #cde0b8 0%, #b3cd8e 100%);
  border-bottom:1px solid #9bbd79;
  padding:16px 16px 0;
  overflow:hidden;
}
.hero-contours{position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none;}
.hero-top{display:flex; align-items:center; gap:11px; margin-bottom:12px; position:relative; z-index:2;}
.brand-mark{
  width:42px; height:42px; border-radius:12px;
  background:linear-gradient(135deg, #e0983f, #c97a2a);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.brand-mark svg{width:26px; height:26px;}
.hero-link-btn{
  margin-left:auto; flex-shrink:0; width:36px; height:36px; border-radius:50%;
  background:rgba(28,39,20,.10); display:flex; align-items:center; justify-content:center;
  position:relative; z-index:2; text-decoration:none;
}
.hero-link-btn svg{width:18px; height:18px;}
.hero h1{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:27px; font-weight:800; margin:0; letter-spacing:-0.5px;
  position:relative; z-index:2;
}
.hero .tagline{font-size:11.5px; color:#4a5a3e; margin-top:1px; position:relative; z-index:2;}

.tabs{
  display:flex; gap:4px; overflow-x:auto; padding-bottom:0;
  scrollbar-width:none; position:relative; z-index:2;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  font-family:'Space Grotesk',sans-serif;
  background:none; border:none; color:var(--text-faint);
  font-size:13px; font-weight:600;
  padding:10px 12px 12px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; white-space:nowrap;
  border-bottom:2.5px solid transparent;
  min-width:64px;
}
.tab-btn .ic{display:flex; color:inherit;}
.tab-btn .ic svg{width:21px; height:21px; stroke:currentColor;}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}

main{padding:16px 14px 0;}
.view{display:none;}
.view.active{display:block;}

/* ---------- Cards / generic ---------- */
.panel{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:16px 15px;
  margin-bottom:14px;
  box-shadow:0 1px 0 rgba(0,0,0,.15);
}
.panel.accent-top{border-top:3px solid var(--accent);}
.panel-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:16px; font-weight:700;
  margin:0 0 12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.spacer{flex:1;}

.btn{
  font-family:'Inter',sans-serif;
  font-size:13.5px; font-weight:600;
  border-radius:10px;
  padding:11px 16px;
  min-height:var(--tap);
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn.primary{background:var(--accent); color:#12160f; border-color:var(--accent);}
.btn.ghost{background:none; border-color:transparent; color:var(--text-dim);}
.btn.danger{color:var(--danger); border-color:transparent; background:none;}
.btn.small{padding:8px 12px; min-height:38px; font-size:12.5px;}
.btn.block{width:100%;}
.btn.icon-only{padding:0; width:var(--tap); height:var(--tap); border-radius:50%;}
.btn:disabled{opacity:.4;}

input,select,textarea{
  font-family:'Inter',sans-serif;
  background:var(--bg-alt);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:9px;
  padding:11px 12px;
  font-size:15px;
  min-height:var(--tap);
  outline:none;
  width:100%;
}
input[type=number]{font-family:'JetBrains Mono',monospace;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
label.field{display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--text-faint); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
textarea{min-height:60px; resize:vertical;}

.badge{
  font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600;
  padding:4px 9px; border-radius:20px;
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block; flex-shrink:0;}

/* ---------- Animated icons ---------- */
.gicon{
  width:56px; height:56px; min-width:56px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; padding:6px;
  flex-shrink:0;
}
.gicon svg{width:100%; height:100%; overflow:visible;}
.gicon.lg{width:76px; height:76px; min-width:76px; border-radius:16px; padding:9px;}
.anim-bob{animation:bob 1.5s ease-in-out infinite;}
.anim-press{animation:press 1.1s ease-in-out infinite;}
.anim-swing{animation:swing 1.3s ease-in-out infinite; transform-origin:50% 65%;}
.anim-bounce{animation:bounce 0.7s ease-in-out infinite;}
.anim-pulse{animation:pulse 2.2s ease-in-out infinite; transform-origin:50% 55%;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
@keyframes press{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(3px) scaleY(0.96);}}
@keyframes swing{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(5deg);}}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}

/* ---------- Item cards ---------- */
.item-grid{display:flex; flex-direction:column; gap:10px;}
.item-card{
  display:flex; align-items:center; gap:12px;
  background:var(--bg-alt);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  padding:11px;
}
.item-main{flex:1; min-width:0;}
.item-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap;}
.item-name{font-weight:700; font-size:14.5px;}
.item-meta{font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim);}
.item-notes{font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.4;}
.item-actions{display:flex; flex-direction:column; gap:6px; flex-shrink:0;}
.item-actions .row{flex-wrap:nowrap;}

.cat-filters{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; overflow-x:auto;}
.cat-chip{
  font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600;
  padding:8px 13px; border-radius:20px; min-height:36px;
  border:1px solid var(--border); background:var(--bg-alt); color:var(--text-dim);
  cursor:pointer; display:flex; align-items:center; white-space:nowrap;
}
.cat-chip.active{color:#12160f; border-color:transparent;}

.fab-add{
  width:34px; height:34px; border-radius:50%;
  background:var(--accent); color:#12160f; border:none;

/* Target pace, given a target distance (km) and target time (min) - e.g. 5km in 35min = 7:00/km */
function calcPace(distanceKm, durationMin){
  const d = parseFloat(distanceKm), t = parseFloat(durationMin);
  if(!d || d<=0 || !t || t<=0) return '-';
  const paceMin = t/d;
  const mins = Math.floor(paceMin);
  const secs = Math.round((paceMin-mins)*60);
  const secStr = secs<10 ? '0'+secs : ''+secs;
  return `${mins}:${secStr}/km`;
}

  [/incline push|push-?up/,'pushup'],
  [/fly|flye/,'flye'],
  [/pull-?apart/,'pullapart'],

function resolveTemplate(name){
  const n = (name||'').toLowerCase();
  for(const [re,t] of ICON_RULES){ if(re.test(n)) return t; }
  return 'generic';
}
function iconRaw(name,color){
  const t = resolveTemplate(name);
  const svg = svgWrap(TEMPLATES[t](color));
  const anim = ANIM_MAP[t] || 'anim-pulse';
  return { svg, anim };
}
function icon(name,color,size){
  const { svg, anim } = iconRaw(name,color);
  return `<div class="gicon ${size==='lg'?'lg':''} ${anim}" style="background:${color}18;">${svg}</div>`;
}

const STORAGE_KEY = 'chris2-db-v2';

// this page's data lives only in this browser, via localStorage - there is no shared
// backend, so two devices opening the same link each keep their own separate copy (see
// the "Move to my other device" panel on the Progress tab for a manual way to carry a
// copy across)
async function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      DB = JSON.parse(raw);
      DB.exercises=DB.exercises||[]; DB.runTypes=DB.runTypes||[]; DB.stretches=DB.stretches||[];
      DB.warmups=DB.warmups||[]; DB.cooldowns=DB.cooldowns||[]; DB.routines=DB.routines||[]; DB.schedule=DB.schedule||{};
      DB.profile = DB.profile || { age:'', gender:'', height:'', weight:'' };
      DB.weightLog = DB.weightLog || [];
      DB.nutritionLog = DB.nutritionLog || {};
      DB.goalHistory = (DB.goalHistory && DB.goalHistory.length) ? DB.goalHistory : [{ date:'2000-01-01', goal:'lose_fat' }];
      Object.keys(DB.schedule).forEach(k=> (DB.schedule[k]||[]).forEach(inst=>{ if(inst.period!=='AM' && inst.period!=='PM') inst.period='AM'; }));
      return;
    }
  }catch(e){}
  DB = defaultData();
  await saveDB();
}
let saveTimer=null;
function saveDB(){
  return new Promise(resolve=>{
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){ console.error('save failed',e); }
      gdriveQueuePush();
      resolve();
    },200);
  });
}

// shared by the manual paste-load button and the Google Drive pull - takes a parsed DB
// object from any source and makes it this device's live data
async function applyIncomingDB(parsed, skipSave){
  if(!parsed || typeof parsed !== 'object') return false;
  DB = parsed;
  DB.exercises=DB.exercises||[]; DB.runTypes=DB.runTypes||[]; DB.stretches=DB.stretches||[];
  DB.warmups=DB.warmups||[]; DB.cooldowns=DB.cooldowns||[]; DB.routines=DB.routines||[]; DB.schedule=DB.schedule||{};
  DB.profile = DB.profile || { age:'', gender:'', height:'', weight:'' };
  DB.weightLog = DB.weightLog || [];
  DB.nutritionLog = DB.nutritionLog || {};
  DB.goalHistory = (DB.goalHistory && DB.goalHistory.length) ? DB.goalHistory : [{ date:'2000-01-01', goal:'lose_fat' }];
  if(!skipSave) await saveDB();
  return true;
}

function gdriveSetStatus(msg){

function gdriveUpdateUI(){

function gdriveEnsureTokenClient(){
  if(gdriveTokenClient) return gdriveTokenClient;
  if(!(window.google && window.google.accounts && window.google.accounts.oauth2)) return null;
  gdriveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    callback: function(resp){
      if(resp && resp.access_token){
        gdriveToken = resp.access_token;
        try{ localStorage.setItem(GDRIVE_WAS_SIGNED_IN_KEY, "1"); }catch(e){}
        gdriveFetchEmail().then(function(){
          gdriveUpdateUI();
          gdriveSetStatus("Signed in. Syncing now...");
          gdriveSyncNow();
        });
      } else {
        gdriveSetStatus("Sign in did not go through, try again.");
      }
    },
    error_callback: function(err){
      var type = err && err.type;
      if(type === "popup_failed_to_open"){
        gdriveSetStatus("Your browser blocked the Google sign-in popup. Allow pop-ups for this site (check the address bar, or your browser/ad-blocker settings), then try again.");
      } else if(type === "popup_closed"){
        gdriveSetStatus("Sign-in window was closed before finishing. Try again and complete the Google sign-in.");
      } else {
        gdriveSetStatus("Sign in did not go through, try again.");
      }
    }
  });
  return gdriveTokenClient;
}

function gdriveSignIn(){
  const client = gdriveEnsureTokenClient();
  if(!client){ gdriveSetStatus("Google sign-in has not loaded yet, try again in a moment."); return; }
  client.requestAccessToken({prompt:"consent"});
}

function gdriveSignInSilent(){
  const client = gdriveEnsureTokenClient();
  if(!client) return;
  client.requestAccessToken({prompt:""});
}

function gdriveSignOut(){
  if(gdriveToken && window.google && google.accounts && google.accounts.oauth2){
    try{ google.accounts.oauth2.revoke(gdriveToken, function(){}); }catch(e){}
  }
  gdriveToken = null;
  gdriveEmail = "";
  try{ localStorage.removeItem(GDRIVE_WAS_SIGNED_IN_KEY); }catch(e){}
  gdriveUpdateUI();
  gdriveSetStatus("Signed out. This device keeps its own copy until you sign in again.");
}

function gdriveAuthedFetch(url, opts){
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers["Authorization"] = "Bearer " + gdriveToken;
  return fetch(url, opts).then(function(res){
    if(res.status === 401){
      gdriveToken = null;
      gdriveUpdateUI();
      gdriveSetStatus("Signed out by Google, sign in again to keep syncing.");
      throw new Error("gdrive_unauthorized");
    }
    return res;
  });
}

function gdriveFetchEmail(){
  return gdriveAuthedFetch("https://www.googleapis.com/oauth2/v3/userinfo").then(function(res){
    if(!res.ok) return null;
    return res.json();
  }).then(function(info){
    if(info && info.email) gdriveEmail = info.email;
  }).catch(function(){});
}

function gdriveFindFileId(){
  if(gdriveFileId) return Promise.resolve(gdriveFileId);
  let cached = null;
  try{ cached = localStorage.getItem(GDRIVE_FILEID_KEY); }catch(e){}
  if(cached){ gdriveFileId = cached; return Promise.resolve(cached); }
  const q = "name='" + GDRIVE_FILENAME + "' and trashed=false";
  const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(q) + "&fields=" + encodeURIComponent("files(id,modifiedTime)");
  return gdriveAuthedFetch(url).then(function(res){ return res.json(); }).then(function(data){
    if(data && data.files && data.files.length){
      gdriveFileId = data.files[0].id;
      try{ localStorage.setItem(GDRIVE_FILEID_KEY, gdriveFileId); }catch(e){}
      return gdriveFileId;
    }
    return null;
  });
}

function gdriveCreateFile(payloadStr){
  const metadata = {name: GDRIVE_FILENAME, mimeType: "application/json"};
  const boundary = "chris2part" + Date.now();
  const body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(metadata) +
    "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + payloadStr +
    "\r\n--" + boundary + "--";
  return gdriveAuthedFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: {"Content-Type": "multipart/related; boundary=" + boundary},
    body: body
  }).then(function(res){ return res.json(); }).then(function(data){
    if(data && data.id){
      gdriveFileId = data.id;
      try{ localStorage.setItem(GDRIVE_FILEID_KEY, gdriveFileId); }catch(e){}
    }
    return gdriveFileId;
  });
}

function gdriveUpdateFile(fileId, payloadStr){
  return gdriveAuthedFetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
    method: "PATCH",
    headers: {"Content-Type": "application/json"},
    body: payloadStr
  });
}

function gdriveFormatWhen(iso){
  try{ return new Date(iso).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
  catch(e){ return "just now"; }
}

function gdrivePushNow(){
  if(!gdriveToken) return Promise.resolve();
  const payload = JSON.parse(JSON.stringify(DB));
  const syncedAt = new Date().toISOString();
  payload._syncedAt = syncedAt;
  const payloadStr = JSON.stringify(payload);
  gdriveSetStatus("Saving to Google Drive...");
  return gdriveFindFileId().then(function(fileId){
    if(fileId) return gdriveUpdateFile(fileId, payloadStr);
    return gdriveCreateFile(payloadStr);
  }).then(function(){
    try{ localStorage.setItem(GDRIVE_MARKER_KEY, syncedAt); }catch(e){}
    gdriveSetStatus("Up to date. Last saved " + gdriveFormatWhen(syncedAt) + ".");
  }).catch(function(err){
    if(err && err.message === "gdrive_unauthorized") return;
    gdriveSetStatus("Could not save to Google Drive, will try again.");
  });
}

async function gdrivePullApply(remote){
  gdriveApplyingRemote = true;
  try{
    await applyIncomingDB(remote, true);
    await saveDB();
    try{ if(remote._syncedAt) localStorage.setItem(GDRIVE_MARKER_KEY, remote._syncedAt); }catch(e){}
  } finally {
    gdriveApplyingRemote = false;
  }
  renderAll();
}

function gdriveSyncNow(){
  if(!gdriveToken){ gdriveSetStatus("Sign in with Google to sync."); return Promise.resolve(); }
  if(gdriveSyncing) return Promise.resolve();
  gdriveSyncing = true;
  gdriveSetStatus("Checking Google Drive...");
  return gdriveFindFileId().then(function(fileId){
    if(!fileId) return gdrivePushNow();
    return gdriveAuthedFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media").then(function(res){
      if(!res.ok) return gdrivePushNow();
      return res.json().catch(function(){ return null; }).then(function(remote){
        if(!remote) return gdrivePushNow();
        let localMarker = null;
        try{ localMarker = localStorage.getItem(GDRIVE_MARKER_KEY); }catch(e){}
        const remoteAt = remote._syncedAt || null;
        if(remoteAt && (!localMarker || new Date(remoteAt) > new Date(localMarker))){
          return gdrivePullApply(remote).then(function(){
            gdriveSetStatus("Up to date. Pulled the latest from Google Drive.");
          });
        } else {
          return gdrivePushNow();
        }
      });
    });
  }).catch(function(err){
    if(err && err.message !== "gdrive_unauthorized") gdriveSetStatus("Could not reach Google Drive, will try again.");
  }).then(function(){
    gdriveSyncing = false;
  });
}

function gdriveQueuePush(){
  if(!gdriveToken || gdriveApplyingRemote) return;
  if(gdrivePushTimer) clearTimeout(gdrivePushTimer);
  gdrivePushTimer = setTimeout(function(){ gdrivePushTimer = null; gdrivePushNow(); }, 1500);
}

function gdriveTrySilentReconnect(){
  let wasSignedIn = false;
  try{ wasSignedIn = localStorage.getItem(GDRIVE_WAS_SIGNED_IN_KEY) === "1"; }catch(e){}
  if(!wasSignedIn) return;
  gdriveSetStatus("Reconnecting to Google Drive...");
  let tries = 0;
  (function tryIt(){
    tries++;
    if(window.google && window.google.accounts && window.google.accounts.oauth2){
      gdriveSignInSilent();
    } else if(tries < 40){
      setTimeout(tryIt, 250);
    } else {
      gdriveSetStatus("Could not reconnect to Google automatically, sign in again when ready.");
    }
  })();
}
function dateKey(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDateLong(key){ const d=new Date(key+'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}); }
function fmtDateShort(key){ const d=new Date(key+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function startOfWeek(d){ const dt=new Date(d); const dow=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-dow); dt.setHours(0,0,0,0); return dt; }

function addToDraft(refType, obj){

  else if(refType==='run') item={refType,refId:obj.id,name:obj.name,type:obj.type,distance:obj.distance,duration:obj.duration,notes:obj.notes};

function toast(msg){
  let t = document.getElementById('toastEl');
  if(!t){
    t = document.createElement('div'); t.id='toastEl';
    t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#f7faf3;border:1px solid #c3d6b1;color:#1c2714;padding:10px 16px;border-radius:10px;font-size:13px;z-index:300;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1'; t.style.display='block';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>{t.style.display='none';},300); }, 1600);
}

      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.dataset.idx), dir = btn.dataset.move==='up'?-1:1;
        const newIdx = idx+dir;
        if(newIdx<0 || newIdx>=builderDraft.items.length) return;

        renderBuilderSheet();

      inp.addEventListener('change', ()=>{

    else if(it.refType==='run'){

      pacePreview = `<div class="item-meta" id="draftPace-${idx}" style="margin-top:4px; color:var(--accent);">Target pace: ${calcPace(it.distance, it.duration)}</div>`;
    }
    return `
      <div class="draft-item">
        ${icon(it.name, meta.color)}
        <div class="item-main">
          <div class="item-name" style="font-size:13px;">${escapeHtml(it.name)}</div>
          ${qty}
          ${pacePreview}

        <div style="display:flex; flex-direction:column; gap:4px;">
          <button class="btn ghost small" data-move="up" data-idx="${idx}">Up</button>

        </div>
        <button class="btn danger small" data-remove-idx="${idx}">x</button>
      </div>
    `;
  }

async function saveDraftRoutine(){
  ensureDraft();
  const name = builderDraft.name.trim();
  if(!name){ toast('Give your routine a name first'); return; }
  if(!builderDraft.items.length){ toast('Add at least one item'); return; }
  if(builderDraft.editingId){
    const r = DB.routines.find(x=>x.id===builderDraft.editingId);
    if(r){ r.name=name; r.items=builderDraft.items; }
  } else {
    const palette = ['#6fa23c','#5f9bd6','#d3684a','#b481d9','#e0983f'];
    DB.routines.push({ id:uid(), name, color:palette[DB.routines.length % palette.length], items:builderDraft.items });
  }
  await saveDB();
  builderDraft = null;
  updateFab();
  closeSheet();
  toast('Routine saved');
  if(currentTab==='routines') renderRoutinesView();
}

function instantiateRoutineOnDate(routineId, key, period){
  const r = DB.routines.find(x=>x.id===routineId);
  if(!r) return;
  DB.schedule[key] = DB.schedule[key] || [];
  const items = r.items.map(it=>{
    const base = JSON.parse(JSON.stringify(it));
    base.id = uid();
    base.done = false;
    base.actual = it.refType==='exercise'
      ? { setsLog: Array.from({length: it.sets||1}, ()=>({weight:'',reps:''})) }
      : {};
    return base;
  });
  DB.schedule[key].push({ id:uid(), routineId:r.id, name:r.name, color:r.color, period: period==='PM'?'PM':'AM', items });
}

function libAddButton(refType, obj){
  return `<button class="fab-add" data-add="${obj.id}" data-type="${refType}" title="Add to routine draft">+</button>`;
}
function wireLibAddButtons(container){
  container.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const type = btn.dataset.type, id = btn.dataset.add;
      const list = type==='exercise'?DB.exercises: type==='run'?DB.runTypes: type==='stretch'?DB.stretches: type==='warmup'?DB.warmups: DB.cooldowns;
      const obj = list.find(x=>x.id===id);
      if(obj) addToDraft(type, obj);
      updateFab();
    });
  });
}

  container.innerHTML = `
    <div class="panel">

  list.innerHTML = filtered.length ? filtered.map(e=>`

/* =========================================================================
   DASHBOARD VIEW
   ========================================================================= */
function currentWeekRange(){
  const monday = startOfWeek(new Date());
  const days=[];
  for(let i=0;i<7;i++){ const dt=new Date(monday); dt.setDate(dt.getDate()+i); days.push(dt); }
  return days;
}
function weeklyCompletionStats(){
  const days = currentWeekRange();
  let total=0, done=0;
  days.forEach(dt=>{
    const key=dateKey(dt);
    (DB.schedule[key]||[]).forEach(inst=> inst.items.forEach(it=>{ total++; if(it.done) done++; }));
  });
  return {total, done, pct: total? Math.round(done/total*100):0};
}
function weightDeltaStats(){
  if(!DB.weightLog.length) return null;
  const sorted = [...DB.weightLog].sort((a,b)=> a.date<b.date?-1:1);
  const latest = sorted[sorted.length-1];
  const first = sorted[0];
  const latestDate = new Date(latest.date+'T00:00:00');
  let weekAgoEntry = null;
  for(let i=sorted.length-1;i>=0;i--){
    const diffDays = (latestDate-new Date(sorted[i].date+'T00:00:00'))/86400000;
    if(diffDays>=6){ weekAgoEntry = sorted[i]; break; }
  }
  return {
    latest: latest.weight,
    latestDate: latest.date,
    deltaWeek: weekAgoEntry ? +(latest.weight-weekAgoEntry.weight).toFixed(1) : null,
    deltaTotal: +(latest.weight-first.weight).toFixed(1),
    entries: sorted.length,
  };
}
function nutritionAdherenceThisWeek(){
  const days = currentWeekRange();
  let loggedDays=0, sumPct=0;
  days.forEach(dt=>{
    const key=dateKey(dt);
    const logged = DB.nutritionLog[key];
    if(logged && logged.calories){
      const t = computeTargetsForDate(key);
      if(t){ sumPct += Math.min(150,(parseFloat(logged.calories)/t.calories)*100); loggedDays++; }
    }
  });
  return loggedDays? {avgPct: Math.round(sumPct/loggedDays), loggedDays} : null;
}
function renderTodayNutritionSummary(todayKey){
  if(!profileComplete()){
    return `<div class="empty-note">Add your age, gender, height and weight in the Progress tab to see today's targets.</div>`;
  }
  const t = computeTargetsForDate(todayKey);
  const weekStart = startOfWeek(new Date());
  const weekAdj = computeWeeklyAdjustment(weekStart);
  const proteinRoll = computeProteinRollover(weekStart);
  const adj = weekAdj.perDay[todayKey];
  const adjCal = adj ? clampAdjust(t.calories, adj.calories, 0.2) : 0;
  const adjC = adj ? clampAdjust(t.carbsG, adj.carbs, 0.3) : 0;
  const adjF = adj ? clampAdjust(t.fatG, adj.fat, 0.3) : 0;
  const finalCal = Math.max(1200, Math.round(t.calories+adjCal));
  const finalP = proteinRoll.targets[todayKey]!=null ? proteinRoll.targets[todayKey] : t.proteinG;
  const finalC = Math.max(0, Math.round(t.carbsG+adjC));
  const finalF = Math.max(0, Math.round(t.fatG+adjF));
  const logged = DB.nutritionLog[todayKey] || {};
  const calPct = Math.min(100, Math.round(((parseFloat(logged.calories)||0)/finalCal)*100));
  const runsToday = runsScheduledForDate(todayKey);
  const snackBit = runsToday.length ? `<div class="snack-suggest" style="margin-top:10px;">${TAB_ICONS.apple}<div><div class="snack-suggest-title">Pre-run fuel idea</div><div class="snack-suggest-body">${escapeHtml(preRunSnackFor(runsToday[0].type))}</div></div></div>` : '';
  const carbBit = t.carbLoad && t.carbLoad.bumpG>0 ? `<div class="water-note" style="color:#e0983f; margin-top:8px;">+${t.carbLoad.bumpG}g carbs today - ${escapeHtml(t.carbLoad.reason)}</div>` : '';
  return `
    <div class="panel-title" style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">Today <span class="item-meta" style="text-transform:none; font-weight:400; margin-left:6px;">${activityLabel(t.factor)}</span></div>
    <div class="macro-targets">
      <div class="macro-chip"><div class="v">${finalCal}</div><div class="l">kcal</div></div>
      <div class="macro-chip"><div class="v">${finalP}g</div><div class="l">protein</div></div>
      <div class="macro-chip"><div class="v">${finalC}g</div><div class="l">carbs</div></div>
      <div class="macro-chip"><div class="v">${finalF}g</div><div class="l">fat</div></div>
      <div class="macro-chip water-chip"><div class="v">${(t.waterMl/1000).toFixed(1)}L</div><div class="l">water</div></div>
    </div>
    <div class="bar-track" style="margin-top:12px;"><div class="bar-fill" style="width:${calPct}%;"></div></div>
    <div class="item-meta" style="margin-top:6px;">${logged.calories ? `${logged.calories} / ${finalCal} kcal logged so far - head to Nutrition to log more` : `Nothing logged yet today - log meals on the Nutrition tab`}</div>
    ${carbBit}${snackBit}
  `;
}
function planBlockForDate(key){
  const entries = DB.schedule[key] || [];
  const routineBlocksHtml = entries.length ? entries.map(e=>{
    const doneCount = e.items.filter(it=>it.done).length;
    const allDone = e.items.length>0 && doneCount===e.items.length;
    const chips = e.items.map(it=>{
      const meta = REFTYPE_META[it.refType] || {color:'#8a9280'};
      return `<div class="today-chip ${it.done?'done':''}" data-jump="${key}">
        ${miniIcon(it.name, meta.color)}
        <span>${escapeHtml(it.name)}</span>
      </div>`;
    }).join('');
    const runItems = e.items.filter(it=>it.refType==='run');
    const runSummary = runItems.length ? `<div class="run-summary-line">${runItems.map(r=>
      `<span><b>${escapeHtml(r.name)}</b>: ${r.distance}km / ${r.duration}min target / ${calcPace(r.distance,r.duration)} pace</span>`
    ).join('')}</div>` : '';
    return `
      <div class="today-routine-block">
        <div class="today-routine-head" data-jump="${key}">
          <span class="dot" style="background:${e.color};"></span>
          <span class="today-routine-name">${escapeHtml(e.name)}</span>
          <span class="badge" style="background:${e.color}22; color:${e.color};">${doneCount}/${e.items.length}${allDone?' - done':''}</span>
        </div>
        <div class="today-chip-row">${chips}</div>
        ${runSummary}
      </div>`;
  }).join('') : '';

  // Look at the NEXT day from this one - prompt extra carbs / hydration the day before it's needed.
  const nextDt = new Date(key+'T00:00:00'); nextDt.setDate(nextDt.getDate()+1);
  const nextKey = dateKey(nextDt);
  const carbInfo = profileComplete() ? tomorrowCarbLoadInfo(key) : {bumpG:0};
  const nextRuns = runsScheduledForDate(nextKey);
  const lookaheadBits = [];
  if(carbInfo.bumpG>0) lookaheadBits.push(`<div class="lookahead-note carb">${TAB_ICONS.apple}<span>Extra carbs today - ${escapeHtml(carbInfo.reason)}, worth topping up glycogen now.</span></div>`);
  if(nextRuns.length) lookaheadBits.push(`<div class="lookahead-note hydrate">${HYDRATE_ICON}<span>Hydrate well today - tomorrow's a run day.</span></div>`);
  const lookaheadHtml = lookaheadBits.length ? `<div class="lookahead-block">${lookaheadBits.join('')}</div>` : '';

  if(!routineBlocksHtml && !lookaheadHtml) return null;
  const emptyNote = !routineBlocksHtml ? `<div class="empty-note" style="margin-bottom:8px;">Nothing scheduled${lookaheadHtml?' - but heads up for tomorrow:':'.'}</div>` : '';
  return emptyNote + routineBlocksHtml + lookaheadHtml;
}

function renderCalendarView(){

  const daysInMonth = new Date(y,m+1,0).getDate();
  const todayKey = dateKey(new Date());

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(y,m,d); const key = dateKey(dt);
    const entries = DB.schedule[key] || [];
    const isToday = key===todayKey;
    const amEntries = entries.filter(e=> e.period!=='PM');
    const pmEntries = entries.filter(e=> e.period==='PM');
    const halfHtml = (list, period) => {
      const pills = list.slice(0,2).map(e=>{
        const doneCount = e.items.filter(it=>it.done).length;

      }).join('');
      const more = list.length>2 ? `<div class="cal-more">+${list.length-2}</div>` : '';
      return `<div class="cal-half" data-day="${key}" data-period="${period}"><span class="cal-half-lbl">${period}</span>${pills}${more}</div>`;
    };
    cells += `<div class="cal-cell ${isToday?'today':''}" data-day="${key}"><div class="cal-daynum">${d}</div>${halfHtml(amEntries,'AM')}${halfHtml(pmEntries,'PM')}</div>`;
  }

  container.innerHTML = `
    <div class="panel">
      <div class="cal-header">
        <button class="btn small icon-only" id="calPrev">&larr;</button>
        <div class="cal-month">${monthLabel}</div>
        <button class="btn small icon-only" id="calNext">&rarr;</button>
      </div>
      <div class="row" style="justify-content:center; margin-bottom:10px;"><button class="btn small" id="calToday">Today</button></div>
      <div class="cal-grid">
        <div class="cal-dow">Mon</div><div class="cal-dow">Tue</div><div class="cal-dow">Wed</div>
        <div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div><div class="cal-dow">Sun</div>
        ${cells}
      </div>
      <div class="cal-hint">Tap a day for AM/PM detail / Press and hold a routine to drag it to another day or half</div>
    </div>
    <div class="panel">
      <div class="panel-title">Weekly pattern</div>
      <div class="section-sub">Applies Workout A/B/C plus an easy and long run to a chosen week. Won't overwrite days that already have something scheduled.</div>
      <div class="row week-anchor-row">
        <input type="date" id="weekAnchor" value="${dateKey(startOfWeek(new Date()))}" style="max-width:170px;">
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" id="applyTemplate">Apply pattern</button>
        <button class="btn ghost" id="clearWeek">Clear that week</button>
      </div>
    </div>
  `;

  container.querySelectorAll('.cal-cell[data-day]').forEach(c=>{
    c.addEventListener('click', (ev)=>{ if(ev.target.closest('[data-entry]')) return; openDayModal(c.dataset.day); });
  });
  document.getElementById('calPrev').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderCalendarView(); });
  document.getElementById('calNext').addEventListener('click', ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderCalendarView(); });
  document.getElementById('calToday').addEventListener('click', ()=>{ calMonth=new Date(); calMonth.setDate(1); renderCalendarView(); });
  document.getElementById('applyTemplate').addEventListener('click', applyWeeklyTemplate);
  document.getElementById('clearWeek').addEventListener('click', clearWeek);

  wireDragPills(container);
}

async function applyWeeklyTemplate(){
  const anchorVal = document.getElementById('weekAnchor').value;
  const anchor = anchorVal ? new Date(anchorVal+'T00:00:00') : new Date();
  const monday = startOfWeek(anchor);
  const byName = n => DB.routines.find(r=>r.name===n);
  const plan = {
    0: byName('Workout A - Running Strength'),
    1: DB.routines.find(r=> r.items.some(it=>it.refType==='run' && it.type==='easy')) || null,
    2: byName('Workout B - Back & Chest'),
    4: byName('Workout C - Arms, Abs & Core'),
    5: DB.routines.find(r=> r.items.some(it=>it.refType==='run' && it.type==='long')) || null,
  };
  Object.keys(plan).forEach(offset=>{
    const r = plan[offset]; if(!r) return;
    const dt = new Date(monday); dt.setDate(dt.getDate()+parseInt(offset));
    const key = dateKey(dt);
    if(DB.schedule[key] && DB.schedule[key].length) return;
    instantiateRoutineOnDate(r.id, key);
  });
  await saveDB();
  renderCalendarView();
  toast('Weekly pattern applied');
}
async function clearWeek(){
  const anchorVal = document.getElementById('weekAnchor').value;
  const anchor = anchorVal ? new Date(anchorVal+'T00:00:00') : new Date();
  const monday = startOfWeek(anchor);
  for(let i=0;i<7;i++){ const dt=new Date(monday); dt.setDate(dt.getDate()+i); delete DB.schedule[dateKey(dt)]; }
  await saveDB(); renderCalendarView();
}

/* ---------- Drag & drop for calendar pills (pointer events, mobile-friendly long-press) ---------- */
function wireDragPills(container){
  container.querySelectorAll('.cal-pill[data-entry]').forEach(pill=>{
    pill.addEventListener('pointerdown', (ev)=> onPillPointerDown(ev, pill));
    pill.addEventListener('click', (ev)=>{
      // Only fires as a genuine tap (no drag occurred) - handled by suppressClick flag
      if(pill._suppressClick){ pill._suppressClick=false; return; }
      openDayModal(pill.dataset.day, pill.dataset.entry);
    });
  });
}

let dragCtx = null;
function onPillPointerDown(ev, pill){
  const startX = ev.clientX, startY = ev.clientY;
  const fromKey = pill.dataset.day, entryId = pill.dataset.entry, fromPeriod = pill.dataset.period;
  let longPressTimer = null;
  let dragging = false;
  let moved = false;

  function cleanup(){
    clearTimeout(longPressTimer);
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    document.getElementById('dragGhost').style.display = 'none';
    document.querySelectorAll('.cal-half.drop-target').forEach(c=>c.classList.remove('drop-target'));
    pill.classList.remove('dragging-src');
  }
  function beginDrag(){
    dragging = true;
    pill.classList.add('dragging-src');
    const ghost = document.getElementById('dragGhost');
    ghost.textContent = pill.textContent;
    ghost.style.background = pill.style.background;
    ghost.style.left = startX+'px'; ghost.style.top = startY+'px';
    ghost.style.display = 'block';
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
  }
  function onMove(mv){
    const dx = mv.clientX-startX, dy = mv.clientY-startY;
    if(!dragging){
      if(Math.abs(dx)>10 || Math.abs(dy)>10){ clearTimeout(longPressTimer); }
      return;
    }
    moved = true;
    mv.preventDefault();
    const ghost = document.getElementById('dragGhost');
    ghost.style.left = mv.clientX+'px'; ghost.style.top = mv.clientY+'px';
    document.querySelectorAll('.cal-half.drop-target').forEach(c=>c.classList.remove('drop-target'));
    const el = document.elementFromPoint(mv.clientX, mv.clientY);
    const half = el && el.closest ? el.closest('.cal-half[data-period]') : null;
    if(half) half.classList.add('drop-target');
  }
  async function onUp(uv){
    if(dragging){
      const el = document.elementFromPoint(uv.clientX, uv.clientY);
      const half = el && el.closest ? el.closest('.cal-half[data-period]') : null;
      if(half && half.dataset.day && (half.dataset.day!==fromKey || half.dataset.period!==fromPeriod)){
        moveScheduleEntry(fromKey, half.dataset.day, entryId, half.dataset.period);
        await saveDB();
        renderCalendarView();
        toast(`Moved to ${fmtDateShort(half.dataset.day)} ${half.dataset.period}`);
      }
      pill._suppressClick = true;
    }
    cleanup();
  }
  function onCancel(){ cleanup(); }

  longPressTimer = setTimeout(beginDrag, 320);
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
}

function moveScheduleEntry(fromKey, toKey, entryId, toPeriod){
  const list = DB.schedule[fromKey] || [];
  const idx = list.findIndex(e=>e.id===entryId);
  if(idx===-1) return;
  const [entry] = list.splice(idx,1);
  if(toPeriod==='AM' || toPeriod==='PM') entry.period = toPeriod;
  DB.schedule[toKey] = DB.schedule[toKey] || [];
  DB.schedule[toKey].push(entry);
  if(list.length===0) delete DB.schedule[fromKey];
}

      <label class="field">Felt<input type="text" data-run-field="feel" data-item="${it.id}" data-instance="${instanceId}" value="${(it.actual&&it.actual.feel)?it.actual.feel:''}" placeholder="easy"></label>

function wireDayEntryEvents(key){
  const container = document.getElementById('dayEntries');
  if(!container) return;
  container.querySelectorAll('[data-check-item]').forEach(chk=>{
    chk.addEventListener('click', async ()=>{
      const item = findScheduleItem(key, chk.dataset.instance, chk.dataset.checkItem);
      if(item){ item.done = !item.done; await saveDB(); openDayModal(key); renderCalendarView(); }
    });
  });
  container.querySelectorAll('[data-remove-instance]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      DB.schedule[key] = (DB.schedule[key]||[]).filter(e=>e.id!==btn.dataset.removeInstance);
      if(DB.schedule[key].length===0) delete DB.schedule[key];
      await saveDB(); openDayModal(key); renderCalendarView();
    });
  });
  container.querySelectorAll('[data-toggle-period]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const inst = (DB.schedule[key]||[]).find(e=>e.id===btn.dataset.togglePeriod);
      if(inst){ inst.period = inst.period==='PM' ? 'AM' : 'PM'; await saveDB(); openDayModal(key); renderCalendarView(); }
    });
  });
  container.querySelectorAll('[data-set-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const item = findScheduleItem(key, inp.dataset.instance, inp.dataset.item);
      if(item){
        item.actual = item.actual || {setsLog:[]};
        item.actual.setsLog = item.actual.setsLog || [];

   ========================================================================= */
let nutriWeekAnchor = startOfWeek(new Date());

const GOAL_META = {
  lose_fat:     { label:'Lose Fat',     color:'#d3684a' },
  maintenance:  { label:'Maintenance',  color:'#5f9bd6' },
  build_muscle: { label:'Build Muscle', color:'#6fa23c' },
};
const GOAL_CONFIG = {
  lose_fat:     { calMultiplier:0.87, proteinPerKg:2.0, fatPct:0.20 }, // modest deficit, protein high, fat low
  maintenance:  { calMultiplier:1.00, proteinPerKg:1.8, fatPct:0.25 }, // hold steady
  build_muscle: { calMultiplier:1.10, proteinPerKg:2.0, fatPct:0.25 }, // modest surplus, protein still high to support growth
};
function goalForDate(key){
  const sorted = [...DB.goalHistory].sort((a,b)=> a.date<b.date?-1:1);
  let applicable = sorted[0];
  for(const g of sorted){ if(g.date<=key) applicable=g; else break; }
  return applicable ? applicable.goal : 'lose_fat';
}
async function setGoal(newGoal){
  const today = dateKey(new Date());
  const existing = DB.goalHistory.find(g=>g.date===today);
  if(existing) existing.goal = newGoal; else DB.goalHistory.push({date:today, goal:newGoal});
  DB.goalHistory.sort((a,b)=> a.date<b.date?-1:1);
  await saveDB();
}

function computeBMR(){
  const p = DB.profile;
  const w = parseFloat(p.weight), h = parseFloat(p.height), a = parseFloat(p.age);
  if(!w || !h || !a) return null;
  if(p.gender==='male') return 10*w + 6.25*h - 5*a + 5;
  if(p.gender==='female') return 10*w + 6.25*h - 5*a - 161;
  return 10*w + 6.25*h - 5*a - 78;
}
function activityFactorForDate(key){
  const entries = DB.schedule[key] || [];
  let load = 0;
  entries.forEach(inst=>{
    (inst.items||[]).forEach(it=>{
      if(it.refType==='exercise') load += 0.03;
      if(it.refType==='run') load += 0.06 + (parseFloat(it.distance)||0)*0.02;
      if(it.refType==='warmup' || it.refType==='cooldown' || it.refType==='stretch') load += 0.008;
    });
  });
  return Math.min(1.9, 1.2 + load);
}
/* Looks at tomorrow's schedule so today's carbs can be bumped up ahead of a demanding
   day - topping up glycogen the day before matters more than trying to fuel same-day. */
function tomorrowCarbLoadInfo(key){
  const tomorrow = new Date(key+'T00:00:00'); tomorrow.setDate(tomorrow.getDate()+1);
  const tKey = dateKey(tomorrow);
  const entries = DB.schedule[tKey] || [];
  let hasLongRun=false, hasRun=false, exerciseCount=0, runDetail=null;
  entries.forEach(inst=> (inst.items||[]).forEach(it=>{
    if(it.refType==='run'){
      hasRun = true;
      const dist = parseFloat(it.distance)||0;
      if(it.type==='long' || dist>=8) hasLongRun = true;
      if(!runDetail || dist>(parseFloat(runDetail.distance)||0)) runDetail = it;
    }
    if(it.refType==='exercise') exerciseCount++;
  }));
  let bumpG = 0, reason = '';
  if(hasLongRun){ bumpG=60; reason='long run tomorrow'; }
  else if(hasRun){ bumpG=30; reason='a run tomorrow'; }
  else if(exerciseCount>=5){ bumpG=20; reason='a big training day tomorrow'; }
  return { bumpG, reason, hasLongRun, hasRun, runDetail };
}
function computeTargetsForDate(key){
  const bmr = computeBMR();
  if(bmr==null) return null;
  const factor = activityFactorForDate(key);
  const goal = goalForDate(key);
  const cfg = GOAL_CONFIG[goal] || GOAL_CONFIG.lose_fat;
  const maintenanceCal = bmr*factor;
  let calories = Math.round(maintenanceCal * cfg.calMultiplier);
  const weight = parseFloat(DB.profile.weight)||70;
  const proteinG = Math.round(weight*cfg.proteinPerKg);
  const fatG = Math.round((calories*cfg.fatPct)/9);
  let carbsG = Math.max(0, Math.round((calories - proteinG*4 - fatG*9)/4)); // remainder fuels training
  const carbLoad = tomorrowCarbLoadInfo(key);
  if(carbLoad.bumpG>0){
    carbsG += carbLoad.bumpG;
    calories += carbLoad.bumpG*4; // keep totals internally consistent with the extra carbs
  }
  const waterMl = Math.round(weight*35 + Math.max(0,(factor-1.2))*1300);
  return { calories, proteinG, fatG, carbsG, waterMl, factor, maintenanceCal:Math.round(maintenanceCal), goal, carbLoad };
}
/* Pre-run fuel suggestions, picked by session type */
const PRE_RUN_SNACKS = {
  easy: 'Banana, or a slice of toast with honey - light and easy to digest, 30-60 min before.',
  recovery: 'Banana, or a small handful of dried fruit - just enough to top up, nothing heavy.',
  long: 'Porridge with banana, a bagel with jam, or a couple of rice cakes with honey - 1-2 hrs before so it settles.',
  tempo: 'Banana with a spoon of honey, or a slice of toast with jam - 45-60 min before.',
  interval: 'Banana or a few dates - quick-digesting carbs, 45-60 min before.',
  hill: 'Banana or a small bowl of porridge - 60-90 min before.',
};
function preRunSnackFor(runType){ return PRE_RUN_SNACKS[runType] || PRE_RUN_SNACKS.easy; }
function runsScheduledForDate(key){
  const entries = DB.schedule[key] || [];
  const runs = [];
  entries.forEach(inst=> (inst.items||[]).forEach(it=>{ if(it.refType==='run') runs.push(it); }));
  return runs;
}
function activityLabel(factor){
  if(factor>=1.55) return 'Big activity day';
  if(factor>=1.35) return 'Active day';
  if(factor>=1.25) return 'Light activity';
  return 'Rest day';
}
async function saveNutritionField(key, field, value){
  DB.nutritionLog[key] = DB.nutritionLog[key] || {};
  DB.nutritionLog[key][field] = value;
  await saveDB();
}
/* How close a logged amount is to its target, as a traffic-light band -
   symmetric both ways, since being far under a target is just as much
   a miss as being far over it (e.g. eating way too little fat). */
function fieldStatusClass(loggedVal, target){
  if(loggedVal===undefined || loggedVal===null || loggedVal==='') return '';
  const v = parseFloat(loggedVal);
  if(isNaN(v) || !target || target<=0) return '';
  const pctOff = Math.abs(v-target)/target;
  if(pctOff<=0.05) return 'field-good';
  if(pctOff<=0.10) return 'field-warn';
  return 'field-bad';
}

/* Weekly rollover: if logged days this week ran under/over target, nudge the remaining days
   (today onward) to compensate, weighted by how active each remaining day is. */
function computeWeeklyAdjustment(weekStart){
  const todayKey = dateKey(new Date());
  const days = [];
  for(let i=0;i<7;i++){ const dt=new Date(weekStart); dt.setDate(dt.getDate()+i); days.push(dateKey(dt)); }

  let delta = {calories:0, protein:0, carbs:0, fat:0};
  let loggedDaysCount = 0;
  const remaining = [];
  days.forEach(key=>{
    const t = computeTargetsForDate(key);
    const logged = DB.nutritionLog[key];
    const isPastOrToday = key <= todayKey;
    if(isPastOrToday && logged && logged.calories){
      delta.calories += (parseFloat(logged.calories)||0) - t.calories;
      delta.protein  += (parseFloat(logged.protein)||0)  - t.proteinG;
      delta.carbs    += (parseFloat(logged.carbs)||0)    - t.carbsG;
      delta.fat      += (parseFloat(logged.fat)||0)      - t.fatG;
      loggedDaysCount++;
    }
    if(key >= todayKey) remaining.push({key, factor:t.factor});
  });

  if(loggedDaysCount===0 || remaining.length===0) return { delta, loggedDaysCount, perDay:{} };

  const totalFactor = remaining.reduce((s,r)=>s+r.factor,0) || 1;
  const perDay = {};
  remaining.forEach(r=>{
    const share = r.factor/totalFactor;
    perDay[r.key] = {
      calories: Math.round(-delta.calories * share),
      protein:  Math.round(-delta.protein  * share),
      carbs:    Math.round(-delta.carbs    * share),
      fat:      Math.round(-delta.fat      * share),
    };
  });
  return { delta, loggedDaysCount, perDay };
}
function clampAdjust(base, adj, pct){
  const cap = base*pct;
  return Math.max(-cap, Math.min(cap, adj));
}
function weeklySuggestionText(delta, loggedDaysCount){
  if(loggedDaysCount===0) return null;
  const bits = [];
  if(Math.abs(delta.calories)>=150){
    bits.push(delta.calories<0
      ? `you're running ${Math.abs(Math.round(delta.calories))} kcal under target so far this week - the remaining days are nudged up a little, more so on your training days`
      : `you're running ${Math.round(delta.calories)} kcal over target so far this week - the remaining days are nudged down slightly to balance it out`);
  }
  if(Math.abs(delta.fat)>=20 && delta.fat>0){
    bits.push(`fat has crept ${Math.round(delta.fat)}g over - worth trimming back slightly to keep it on the lower side`);
  }
  if(!bits.length) return 'nicely on target so far this week - keep doing what you\'re doing.';
  return bits.join('; ') + '.';
}

/* Protein isn't literally "banked" by the body day to day - muscle protein synthesis
   runs on a daily cycle, not a weekly one. But total weekly intake is what actually
   correlates with outcomes, so this nudges the next day's target up after a shortfall
   as a practical way to bring your weekly average back on track - not a literal carry-forward. */
function computeProteinRollover(weekStart){
  const days = [];
  for(let i=0;i<7;i++){ const dt=new Date(weekStart); dt.setDate(dt.getDate()+i); days.push(dateKey(dt)); }
  const targets = {}, carryIn = {};
  let runningCarry = 0;
  days.forEach(key=>{
    const base = computeTargetsForDate(key).proteinG;
    carryIn[key] = Math.round(runningCarry);
    const adjustedTarget = Math.round(base + runningCarry);
    targets[key] = adjustedTarget;
    const logged = DB.nutritionLog[key] && DB.nutritionLog[key].protein;
    if(logged!==undefined && logged!==null && logged!==''){
      const shortfall = adjustedTarget - parseFloat(logged);
      runningCarry = Math.max(0, shortfall);
    }
    // if not logged yet, leave runningCarry untouched - an unlogged day is simply skipped
  });
  return { targets, carryIn };
}

function waterWaveSvg(pct, uid){
  const w=280,h=26;
  const fillW = Math.max(0, w*Math.min(100,pct)/100);
  const clipId = 'wclip-'+uid.replace(/[^a-zA-Z0-9]/g,'');
  return `<svg viewBox="0 0 ${w} ${h}" class="water-wave-svg">
    <defs><clipPath id="${clipId}"><rect x="0" y="0" width="${fillW.toFixed(1)}" height="${h}" rx="13"/></clipPath></defs>
    <rect x="0" y="0" width="${w}" height="${h}" rx="13" fill="#17232b"/>
    <g clip-path="url(#${clipId})">
      <rect x="0" y="0" width="${w}" height="${h}" fill="#2d80b8"/>
      <path d="M0 8 Q 12 3 24 8 T 48 8 T 72 8 T 96 8 T 120 8 T 144 8 T 168 8 T 192 8 T 216 8 T 240 8 T 264 8 T 288 8" stroke="#7ec8ea" stroke-width="1.4" fill="none" opacity="0.55"/>
      <path d="M0 14 Q 12 10 24 14 T 48 14 T 72 14 T 96 14 T 120 14 T 144 14 T 168 14 T 192 14 T 216 14 T 240 14 T 264 14 T 288 14" stroke="#5fb2e8" stroke-width="1" fill="none" opacity="0.4"/>
    </g>
    <text x="${w-8}" y="${h/2+4}" text-anchor="end" font-size="11" font-family="JetBrains Mono, monospace" fill="#1c2714">${pct}%</text>
  </svg>`;
}
function sparklineSvg(points, color){
  // points: [{date, value}], at least 2, ascending by date
  const W=600,H=160,padL=36,padR=14,padT=16,padB=26;
  const vals = points.map(p=>p.value);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){ min-=1; max+=1; }
  const rangePad = (max-min)*0.15 || 1;
  min -= rangePad; max += rangePad;
  const xStep = (W-padL-padR) / (points.length-1);
  const yFor = v => padT + (H-padT-padB) * (1 - (v-min)/(max-min));
  const pts = points.map((p,i)=> [padL+i*xStep, yFor(p.value)]);
  const linePath = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${(H-padB).toFixed(1)} L${pts[0][0].toFixed(1)},${(H-padB).toFixed(1)} Z`;
  const dots = pts.map(p=> `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${color}"/>`).join('');
  const firstLbl = `<text x="${pts[0][0]}" y="${H-8}" font-size="9" fill="#7c8a6e" font-family="JetBrains Mono, monospace" text-anchor="start">${fmtDateShort(points[0].date)}</text>`;
  const lastLbl = `<text x="${pts[pts.length-1][0]}" y="${H-8}" font-size="9" fill="#7c8a6e" font-family="JetBrains Mono, monospace" text-anchor="end">${fmtDateShort(points[points.length-1].date)}</text>`;
  const maxLbl = `<text x="${padL-6}" y="${yFor(max-rangePad)}" font-size="9" fill="#7c8a6e" font-family="JetBrains Mono, monospace" text-anchor="end">${(max-rangePad).toFixed(1)}</text>`;
  const minLbl = `<text x="${padL-6}" y="${yFor(min+rangePad)}" font-size="9" fill="#7c8a6e" font-family="JetBrains Mono, monospace" text-anchor="end">${(min+rangePad).toFixed(1)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">
    <path d="${areaPath}" fill="${color}22" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}${firstLbl}${lastLbl}${maxLbl}${minLbl}
  </svg>`;
}
function renderWeightChartSvg(){
  const log = DB.weightLog.slice(-14);
  if(log.length<2) return `<div class="empty-note">Log at least two weigh-ins to see your trend here.</div>`;
  const svg = sparklineSvg(log.map(l=>({date:l.date,value:l.weight})), '#6fa23c');
  const latest = log[log.length-1].weight, first = log[0].weight;
  const delta = latest-first;
  const deltaTxt = (delta>=0?'+':'')+delta.toFixed(1)+'kg since first log';
  return `<div class="chart-wrap">${svg}<div class="item-meta" style="margin-top:6px;">${escapeHtml(deltaTxt)} / latest ${latest}kg</div></div>`;
}

/* ---------- Exercise progress history ---------- */
function exerciseHistoryList(){
  const map = {}; // name -> [{date,weight,reps,sets,plannedSets,plannedReps}]
  Object.keys(DB.schedule).sort().forEach(key=>{
    (DB.schedule[key]||[]).forEach(inst=>{
      inst.items.forEach(it=>{
        if(it.refType==='exercise' && it.done){
          const log = (it.actual&&it.actual.setsLog)||[];
          const weights = log.map(s=>parseFloat(s.weight)).filter(v=>!isNaN(v)&&v>0);
          const totalReps = log.reduce((s,x)=> s + (parseInt(x.reps)||0), 0);
          // Always record the completed session, even if no weight/reps were typed in -
          // fall back to the planned sets/reps so it still shows up in the history.
          map[it.name] = map[it.name] || [];
          map[it.name].push({
            date:key,
            weight: weights.length ? Math.max(...weights) : null,
            reps: totalReps || null,
            plannedReps: it.reps,
            sets: log.length || it.sets,
            category: it.category,
          });
        }
      });
    });
  });
  return map;
}
function renderProgressExercisesSection(){
  const map = exerciseHistoryList();
  const names = Object.keys(map);
  if(!names.length) return `<div class="panel"><div class="empty-note">No completed exercises logged yet - tick off an exercise in the calendar to start building history here.</div></div>`;
  return names.map(name=>{
    const points = map[name];
    const last = points[points.length-1];
    const prev = points.length>1 ? points[points.length-2] : null;
    const weightPts = points.filter(p=>p.weight!=null).map(p=>({date:p.date, value:p.weight}));
    let trend = '';
    if(prev && last.weight!=null && prev.weight!=null){
      const d = last.weight-prev.weight;
      trend = d>0 ? `<span style="color:var(--accent);">&#9650; +${d.toFixed(1)}kg</span>` : d<0 ? `<span style="color:var(--rust);">&#9660; ${d.toFixed(1)}kg</span>` : `<span class="item-meta">steady</span>`;
    }
    const cat = CATS[last.category] || CATS.custom;
    const repsDisplay = last.reps!=null ? `${last.reps} reps` : `${last.plannedReps||''} (planned)`;
    return `
      <div class="panel">
        <div class="panel-title">
          <span style="display:flex; align-items:center; gap:8px;"><span class="dot" style="background:${cat.color};"></span>${escapeHtml(name)}</span>
          <span class="item-meta">${points.length} sessions</span>
        </div>
        ${weightPts.length>=2 ? `<div class="chart-wrap">${sparklineSvg(weightPts, cat.color)}</div>` : `<div class="empty-note">Log a weight for this exercise on 2+ sessions to see a trend chart.</div>`}
        <div class="row" style="margin-top:10px; justify-content:space-between;">
          <div class="item-meta">Last: ${last.weight!=null?last.weight+'kg':'bodyweight'} / ${repsDisplay} / ${last.sets} sets / ${fmtDateShort(last.date)}</div>
          <div>${trend}</div>
        </div>
      </div>
    `;
  }).join('');
}

/* ---------- Running progress history ---------- */
function runHistoryList(){
  const points = [];
  Object.keys(DB.schedule).sort().forEach(key=>{
    (DB.schedule[key]||[]).forEach(inst=>{
      inst.items.forEach(it=>{
        if(it.refType==='run' && it.done){
          const dist = parseFloat(it.actual&&it.actual.distanceDone) || parseFloat(it.distance) || 0;
          const time = parseFloat(it.actual&&it.actual.timeDone) || parseFloat(it.duration) || 0;
          const vo2 = it.actual&&it.actual.vo2max ? parseFloat(it.actual.vo2max) : null;
          points.push({ date:key, distance:dist, time, vo2, feel: it.actual&&it.actual.feel, name: it.name });
        }
      });
    });
  });
  return points;
}
function renderProgressRunningSection(){
  const runs = runHistoryList();
  if(!runs.length) return `<div class="panel"><div class="empty-note">No completed runs logged yet - tick off a run in the calendar to start tracking here.</div></div>`;
  const totalKm = runs.reduce((s,r)=>s+r.distance,0);
  const distPts = runs.filter(r=>r.distance>0).map(r=>({date:r.date, value:r.distance}));
  const vo2Pts = runs.filter(r=>r.vo2!=null).map(r=>({date:r.date, value:r.vo2}));

  const recentRows = runs.slice(-8).reverse().map(r=> `
    <div class="progress-row">
      <div class="progress-date">${fmtDateShort(r.date)}</div>
      <span class="dot" style="background:#e0983f;"></span>
      <div class="progress-name">${escapeHtml(r.name)}${r.feel?` / ${escapeHtml(r.feel)}`:''}</div>
      <div class="progress-detail">${r.distance}km / ${r.time}min${r.vo2?` / VO2 ${r.vo2}`:''}</div>
    </div>`).join('');

  return `
    <div class="stat-row">
      <div class="stat-box"><div class="num">${runs.length}</div><div class="lbl">Runs logged</div></div>
      <div class="stat-box"><div class="num">${totalKm.toFixed(1)}</div><div class="lbl">Total km</div></div>
    </div>
    <div class="panel">
      <div class="panel-title">Distance per run</div>
      ${distPts.length>=2 ? `<div class="chart-wrap">${sparklineSvg(distPts,'#e0983f')}</div>` : `<div class="empty-note">Log at least two runs to see a trend.</div>`}
    </div>
    <div class="panel">
      <div class="panel-title">VO2 max</div>
      <div class="section-sub">Enter your VO2 max (from a watch, fitness test, or estimate) when logging a run - tracked here over time.</div>
      ${vo2Pts.length>=2 ? `<div class="chart-wrap">${sparklineSvg(vo2Pts,'#5f9bd6')}</div>` : `<div class="empty-note">No VO2 max entries yet - add one next time you log a run.</div>`}
    </div>
    <div class="panel">
      <div class="panel-title">Recent runs</div>
      ${recentRows}
    </div>
  `;
}

let progressSubTab = 'overview';
function renderProgressView(){
  const container = document.getElementById('view-progress');
  const rows = [];
  Object.keys(DB.schedule).sort().reverse().forEach(key=>{
    (DB.schedule[key]||[]).forEach(inst=>{
      inst.items.forEach(it=>{ if(it.done) rows.push({key, it}); });
    });
  });
  const uniqueDays = new Set(rows.map(r=>r.key)).size;
  const totalRunKm = rows.filter(r=>r.it.refType==='run').reduce((s,r)=> s+(parseFloat(r.it.actual?.distanceDone)||parseFloat(r.it.distance)||0),0);
  const totalExercises = rows.filter(r=>r.it.refType==='exercise').length;
  const p = DB.profile;

  const subTabs = [
    {id:'overview', label:'Overview'},
    {id:'exercises', label:'Exercises'},
    {id:'running', label:'Running'},
  ];
  const subTabHtml = `<div class="cat-filters">${subTabs.map(t=>`<div class="cat-chip ${progressSubTab===t.id?'active':''}" data-subtab="${t.id}" style="${progressSubTab===t.id?'background:#6fa23c;border-color:#6fa23c;color:#12160f;':''}">${t.label}</div>`).join('')}</div>`;

  let bodyHtml = '';
  if(progressSubTab==='overview'){
    bodyHtml = `
    <div class="panel">
      <div class="panel-title">Your profile</div>
      <div class="section-sub">Used to work out your calorie and macro targets on the Nutrition tab.</div>
      <div class="profile-grid">
        <label class="field">Age<input type="number" id="pfAge" value="${escapeHtml(p.age)}" placeholder="e.g. 52"></label>
        <label class="field">Gender
          <select id="pfGender">
            <option value="" ${!p.gender?'selected':''}>Select</option>
            <option value="male" ${p.gender==='male'?'selected':''}>Male</option>
            <option value="female" ${p.gender==='female'?'selected':''}>Female</option>
            <option value="other" ${p.gender==='other'?'selected':''}>Other / prefer not to say</option>
          </select>
        </label>
        <label class="field">Height (cm)<input type="number" id="pfHeight" value="${escapeHtml(p.height)}" placeholder="e.g. 180"></label>
        <label class="field">Weight (kg)<input type="number" step="0.1" id="pfWeight" value="${escapeHtml(p.weight)}" placeholder="e.g. 84"></label>
      </div>
      <button class="btn primary block" id="saveProfileBtn" style="margin-top:12px;">Save profile</button>
    </div>

    <div class="panel">
      <div class="panel-title">Move to my other device</div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn primary small" id="chris2GdriveSignInBtn">Sign in with Google</button>
        <button class="btn ghost small" id="chris2GdriveSyncNowBtn" style="display:none;">Sync now</button>
        <button class="btn ghost small" id="chris2GdriveSignOutBtn" style="display:none;">Sign out</button>
      </div>
      <div class="section-sub" id="chris2GdriveWho" style="margin-top:-10px;"></div>
      <div class="section-sub" id="chris2GdriveStatus">Sign in once per device to keep this the same on your phone and your Mac automatically.</div>
      <div style="border-top:1px solid var(--border); margin:4px 0 14px; padding-top:14px;">
        <div class="section-sub">Or move things manually instead: on the device with today's changes, hit "Copy my data" and send it to your other device (Messages, Notes, email, whatever's easiest). On that device, open this page, paste it in below, and hit "Load pasted data".</div>
        <textarea id="chris2SyncText" rows="5" spellcheck="false" style="font-family:'JetBrains Mono',monospace; font-size:11.5px;"></textarea>
        <div class="row" style="margin-top:10px;">
          <button class="btn primary small" id="chris2SyncCopyBtn">Copy my data</button>
          <button class="btn ghost small" id="chris2SyncLoadBtn">Load pasted data</button>
        </div>
      </div>
    </div>

    ${!hasLoggedThisWeek() ? `
    <div class="weighin-card">
      <div class="panel-title" style="margin-bottom:0;">Time for your weekly weigh-in</div>
      <div class="section-sub" style="margin:4px 0 0;">No weight logged yet this week - a quick weekly check-in is enough to see a trend.</div>
      <div class="row">
        <input type="number" step="0.1" id="weighInInput" placeholder="Weight (kg)" style="max-width:140px;">
        <button class="btn primary" id="weighInBtn">Log it</button>
      </div>
    </div>` : ''}

    <div class="panel">
      <div class="panel-title"><span>Weight trend</span><span class="item-meta">${DB.weightLog.length} entries</span></div>
      ${renderWeightChartSvg()}
    </div>

    <div class="panel">
      <div class="panel-title">Progress overview</div>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${uniqueDays}</div><div class="lbl">Days completed</div></div>
        <div class="stat-box"><div class="num">${rows.length}</div><div class="lbl">Items logged</div></div>
        <div class="stat-box"><div class="num">${totalExercises}</div><div class="lbl">Exercises done</div></div>
        <div class="stat-box"><div class="num">${totalRunKm.toFixed(1)}</div><div class="lbl">Km run (logged)</div></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title"><span>History</span><span class="item-meta">most recent first</span></div>
      <div>${rows.length ? rows.map(r=>renderProgressRow(r)).join('') : `<div class="empty-note">Nothing marked complete yet - tick items off in the calendar as you do them.</div>`}</div>
    </div>`;
  } else if(progressSubTab==='exercises'){
    bodyHtml = renderProgressExercisesSection();
  } else if(progressSubTab==='running'){
    bodyHtml = renderProgressRunningSection();
  }

  container.innerHTML = subTabHtml + bodyHtml;

  container.querySelectorAll('[data-subtab]').forEach(chip=>{
    chip.addEventListener('click', ()=>{ progressSubTab = chip.dataset.subtab; renderProgressView(); });
  });

  const saveProfileBtn = document.getElementById('saveProfileBtn');
  if(saveProfileBtn){
    saveProfileBtn.addEventListener('click', async ()=>{
      DB.profile = {
        age: document.getElementById('pfAge').value,
        gender: document.getElementById('pfGender').value,
        height: document.getElementById('pfHeight').value,
        weight: document.getElementById('pfWeight').value,
      };
      await saveDB();
      toast('Profile saved');
      renderProgressView();
    });
  }
  const weighBtn = document.getElementById('weighInBtn');
  if(weighBtn){
    weighBtn.addEventListener('click', ()=> saveWeighIn(document.getElementById('weighInInput').value) );
  }
  const syncText = document.getElementById('chris2SyncText');
  const syncCopyBtn = document.getElementById('chris2SyncCopyBtn');
  const syncLoadBtn = document.getElementById('chris2SyncLoadBtn');
  if(syncCopyBtn){
    syncCopyBtn.addEventListener('click', async ()=>{
      syncText.value = JSON.stringify(DB);
      syncText.focus(); syncText.select();
      let copied = false;
      try{ if(navigator.clipboard){ await navigator.clipboard.writeText(syncText.value); copied = true; } }catch(e){}
      if(!copied){ try{ document.execCommand('copy'); }catch(e){} }
      toast('Copied');
    });
  }
  if(syncLoadBtn){
    syncLoadBtn.addEventListener('click', async ()=>{
      let parsed;
      try{ parsed = JSON.parse(syncText.value); }catch(e){
        toast("That doesn't look like valid data, check you copied and pasted the whole thing");
        return;
      }
      if(!confirm("Replace what's on this device with the pasted data?")) return;
      const ok = await applyIncomingDB(parsed);
      if(!ok){
        toast("That doesn't look like valid data, check you copied and pasted the whole thing");
        return;
      }
      toast('Data loaded');
      renderAll();
    });
  }
  // the Google Drive buttons are brand new DOM nodes every time this panel renders, so
  // they get (re)wired here too, right alongside the manual sync controls above
  gdriveWireButtons();
}
function renderProgressRow(r){
  const it = r.it, meta = REFTYPE_META[it.refType];
  let detail = '';
  if(it.refType==='exercise'){
    const log = (it.actual && it.actual.setsLog) || [];
    const done = log.filter(s=>s.reps||s.weight).length;
    detail = `${done||it.sets} sets`;
  } else if(it.refType==='run'){
    const d = (it.actual&&it.actual.distanceDone) || it.distance;
    const t = (it.actual&&it.actual.timeDone) || it.duration;
    detail = `${d}km / ${t}min`;
  } else { detail = meta.label; }
  return `<div class="progress-row">
    <div class="progress-date">${fmtDateShort(r.key)}</div>
    <span class="dot" style="background:${meta.color};"></span>
    <div class="progress-name">${escapeHtml(it.name)}</div>
    <div class="progress-detail">${escapeHtml(detail)}</div>
  </div>`;
}

   GLOBAL
   ========================================================================= */
document.getElementById('modalBackdrop').addEventListener('click', ev=>{ if(ev.target.id==='modalBackdrop') closeModal(); });
document.getElementById('sheetBackdrop').addEventListener('click', ev=>{ if(ev.target.id==='sheetBackdrop') closeSheet(); });

(async function init(){
  await loadDB();
  renderAll();
  gdriveTrySilentReconnect();
})();
</script>
